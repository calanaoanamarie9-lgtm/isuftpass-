services:
  - type: web
    name: isufstpass
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # MUST be a real Laravel key ("base64:" + 44 chars). Render's
      # generateValue produces a random string of the wrong length, which
      # makes EncryptCookies throw "incorrect key length" on every request.
      # sync: false keeps the dashboard value from being reverted by Blueprint.
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: QR_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: aws-0-ap-southeast-1.pooler.supabase.com
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        value: postgres.jcaazdrprcqwiuocirpc
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      # Laravel's default log channel is `stack` -> `single`, which writes to
      # storage/logs/laravel.log *inside the container*. Render never shows
      # that file, so reported exceptions (report($e)) look like nothing
      # happened. Pointing the default channel at stderr makes every error,
      # including mail failures, appear in Dashboard -> Logs.
      - key: LOG_CHANNEL
        value: stderr
      - key: TRUSTED_PROXIES
        value: "*"
      - key: CRON_SECRET
        generateValue: true
      # --- Mail -------------------------------------------------------------
      # Render's FREE tier blocks outbound SMTP (ports 25/465/587) since
      # 2025-09-26, so plain SMTP can never work here. Mail therefore goes
      # over an HTTPS API, which the free tier does not block.
      #
      # ACTIVE TRANSPORT: Brevo - 300 emails/day, 9,000/month, no card.
      # BREVO_API_KEY is set in the Render dashboard (sync: false, never
      # committed): https://app.brevo.com -> Settings -> SMTP & API.
      # It must exist *before* this file is pushed, or mail is dropped
      # (silently: SafeMailer logs it and nothing 500s) until it is added.
      #
      # MAIL_FROM_ADDRESS must be a sender already verified in Brevo
      # (Settings -> Senders). gmail.com cannot be domain-authenticated, so
      # Brevo rewrites the visible from address for delivery. Mail arrives;
      # only the sender string changes. This is the bridge until school IT
      # adds DNS for isufst.edu.ph.
      #
      # RESEND_API_KEY is deliberately left configured. Switching back is a
      # two-line change in this file (MAIL_MAILER: resend, and
      # MAIL_FROM_ADDRESS: no-reply@isufst.edu.ph) once Resend verifies the
      # school domain - no code change, no new secret.
      # ----------------------------------------------------------------------
      - key: MAIL_MAILER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM_ADDRESS
        value: isufstpass@gmail.com
      - key: MAIL_FROM_NAME
        value: ISUFSTPASS
      - key: SUPABASE_PROJECT_REF
        value: jcaazdrprcqwiuocirpc
      - key: S3_REGION
        value: ap-southeast-1
      - key: S3_BUCKET
        value: avatars
      - key: S3_ENDPOINT
        value: https://jcaazdrprcqwiuocirpc.supabase.co/storage/v1/s3
      - key: S3_PUBLIC_URL
        value: https://jcaazdrprcqwiuocirpc.supabase.co/storage/v1/object/public/avatars
      - key: S3_USE_PATH_STYLE_ENDPOINT
        value: "true"
    # Run pending migrations before the new container goes live. A failing
    # migration aborts the deploy instead of shipping a half-updated schema.
    preDeployCommand: php artisan migrate --force
