services:
  - type: web
    name: isufstpass
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # MUST be a real Laravel key ("base64:" + 44 chars). Render's
      # generateValue produces a random string of the wrong length, which
      # makes EncryptCookies throw "incorrect key length" on every request.
      # sync: false keeps the dashboard value from being reverted by Blueprint.
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: QR_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: aws-0-ap-southeast-1.pooler.supabase.com
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        value: postgres.jcaazdrprcqwiuocirpc
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: TRUSTED_PROXIES
        value: "*"
      - key: CRON_SECRET
        generateValue: true
      # --- Mail -------------------------------------------------------------
      # Render's FREE tier blocks outbound SMTP (ports 25/465/587) since
      # 2025-09-26, so plain SMTP can never work here. Mail therefore goes
      # over Resend's HTTPS API, which the free tier does not block.
      #
      # Set in the Render dashboard (sync: false, never committed):
      #   RESEND_API_KEY  <- https://resend.com -> API Keys
      #                    free: 3,000 emails/month, 100/day, no card
      #
      # MAIL_FROM_ADDRESS is Resend's trial sender and needs no domain
      # verification. Once you verify your own domain in Resend, change it
      # here to a real address such as no-reply@isufst.edu.ph.
      # ----------------------------------------------------------------------
      - key: MAIL_MAILER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM_ADDRESS
        value: onboarding@resend.dev
      - key: MAIL_FROM_NAME
        value: ISUFSTPASS
      - key: SUPABASE_PROJECT_REF
        value: jcaazdrprcqwiuocirpc
      - key: S3_REGION
        value: ap-southeast-1
      - key: S3_BUCKET
        value: avatars
      - key: S3_ENDPOINT
        value: https://jcaazdrprcqwiuocirpc.supabase.co/storage/v1/s3
      - key: S3_PUBLIC_URL
        value: https://jcaazdrprcqwiuocirpc.supabase.co/storage/v1/object/public/avatars
      - key: S3_USE_PATH_STYLE_ENDPOINT
        value: "true"
    # Run pending migrations before the new container goes live. A failing
    # migration aborts the deploy instead of shipping a half-updated schema.
    preDeployCommand: php artisan migrate --force
