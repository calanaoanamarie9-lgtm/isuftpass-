services:
  - type: web
    name: isufstpass
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # MUST be a real Laravel key ("base64:" + 44 chars). Render's
      # generateValue produces a random string of the wrong length, which
      # makes EncryptCookies throw "incorrect key length" on every request.
      # sync: false keeps the dashboard value from being reverted by Blueprint.
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: QR_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: aws-0-ap-southeast-1.pooler.supabase.com
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        value: postgres.jcaazdrprcqwiuocirpc
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: TRUSTED_PROXIES
        value: "*"
      - key: CRON_SECRET
        generateValue: true
      # Email sending is DISABLED: Render's free tier blocks outbound SMTP
      # (ports 25/465/587) and no HTTPS mail API is configured, so nothing
      # could ever be delivered. Every notification is delivered in-app
      # through the database channel instead. MAIL_MAILER=log guarantees no
      # request ever waits on a mail transport again.
      - key: MAIL_MAILER
        value: log
      - key: MAIL_FROM_ADDRESS
        value: no-reply@isufst.edu.ph
      - key: MAIL_FROM_NAME
        value: ISUFSTPASS
      - key: SUPABASE_PROJECT_REF
        value: jcaazdrprcqwiuocirpc
      - key: S3_REGION
        value: ap-southeast-1
      - key: S3_BUCKET
        value: avatars
      - key: S3_ENDPOINT
        value: https://jcaazdrprcqwiuocirpc.supabase.co/storage/v1/s3
      - key: S3_PUBLIC_URL
        value: https://jcaazdrprcqwiuocirpc.supabase.co/storage/v1/object/public/avatars
      - key: S3_USE_PATH_STYLE_ENDPOINT
        value: "true"
    # Run pending migrations before the new container goes live. A failing
    # migration aborts the deploy instead of shipping a half-updated schema.
    preDeployCommand: php artisan migrate --force
