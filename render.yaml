services:
  - type: web
    name: isufstpass
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: QR_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: aws-0-ap-southeast-1.pooler.supabase.com
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        value: postgres.afpbkvqihgsqcjvoaooa
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: TRUSTED_PROXIES
        value: "*"
      - key: CRON_SECRET
        generateValue: true
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: ISUFSTPASS
      - key: SUPABASE_PROJECT_REF
        value: afpbkvqihgsqcjvoaooa
      - key: S3_REGION
        value: ap-southeast-1
      - key: S3_BUCKET
        value: avatars
      - key: S3_ENDPOINT
        value: https://afpbkvqihgsqcjvoaooa.supabase.co/storage/v1/s3
      - key: S3_PUBLIC_URL
        value: https://afpbkvqihgsqcjvoaooa.supabase.co/storage/v1/object/public/avatars
      - key: S3_USE_PATH_STYLE_ENDPOINT
        value: "true"
    # Run pending migrations before the new container goes live. A failing
    # migration aborts the deploy instead of shipping a half-updated schema.
    preDeployCommand: php artisan migrate --force
